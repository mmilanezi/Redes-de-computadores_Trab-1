! ===========================================================================
! R2 - protocolo ativo: OSPF
! Sistema Autonomo: AS 65001
! Gerado por scripts/gerar_topologia.py  .
! ===========================================================================
frr version 8.4
frr defaults traditional
hostname r2
log stdout
no ipv6 forwarding
service integrated-vtysh-config
!
interface lo
 ip address 10.255.0.2/32
!
interface to-r1
 ip ospf cost 10
!
interface to-r3
 ip ospf cost 200
!
router ospf
 ospf router-id 10.255.0.2
 network 10.2.0.0/24 area 0
 network 172.16.12.0/29 area 0
 network 172.16.23.0/29 area 0
 network 10.255.0.2/32 area 0
 passive-interface lan
 passive-interface lo
!
line vty
!
