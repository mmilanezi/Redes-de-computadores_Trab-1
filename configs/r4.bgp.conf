! ===========================================================================
! R4 - protocolo ativo: BGP
! Sistema Autonomo: AS 65002
! Gerado por scripts/gerar_topologia.py  .
! ===========================================================================
frr version 8.4
frr defaults traditional
hostname r4
log stdout
no ipv6 forwarding
service integrated-vtysh-config
!
interface lo
 ip address 10.255.0.4/32
!
router bgp 65002
 bgp router-id 10.255.0.4
 ! RFC 8212 exige politica explicita em sessoes eBGP; em laboratorio
 ! desativamos a exigencia para observar o protocolo sem filtros.
 no bgp ebgp-requires-policy
 no bgp default ipv4-unicast
 timers bgp 60 180
 ! iBGP com R3 (AS 65002) via to-r3
 neighbor 172.16.34.3 remote-as 65002
 neighbor 172.16.34.3 description iBGP-R3-AS65002
 ! eBGP com R5 (AS 65003) via to-r5
 neighbor 172.16.45.5 remote-as 65003
 neighbor 172.16.45.5 description eBGP-R5-AS65003
 !
 address-family ipv4 unicast
  ! anuncia a rede de acesso e o loopback deste roteador
  network 10.4.0.0/24
  network 10.255.0.4/32
  neighbor 172.16.34.3 activate
  neighbor 172.16.34.3 next-hop-self
  neighbor 172.16.45.5 activate
 exit-address-family
!
line vty
!
