! ===========================================================================
! R4 - protocolo ativo: OSPF
! Sistema Autonomo: AS 65002
! Gerado por scripts/gerar_topologia.py  .
! ===========================================================================
frr version 8.4
frr defaults traditional
hostname r4
log stdout
no ipv6 forwarding
service integrated-vtysh-config
!
interface lo
 ip address 10.255.0.4/32
!
interface to-r3
 ip ospf cost 10
!
interface to-r5
 ip ospf cost 10
!
router ospf
 ospf router-id 10.255.0.4
 network 10.4.0.0/24 area 0
 network 172.16.34.0/29 area 0
 network 172.16.45.0/29 area 0
 network 10.255.0.4/32 area 0
 passive-interface lan
 passive-interface lo
!
line vty
!
