! ===========================================================================
! R3 - protocolo ativo: BGP
! Sistema Autonomo: AS 65002
! Gerado por scripts/gerar_topologia.py  .
! ===========================================================================
frr version 8.4
frr defaults traditional
hostname r3
log stdout
no ipv6 forwarding
service integrated-vtysh-config
!
interface lo
 ip address 10.255.0.3/32
!
router bgp 65002
 bgp router-id 10.255.0.3
 ! RFC 8212 exige politica explicita em sessoes eBGP; em laboratorio
 ! desativamos a exigencia para observar o protocolo sem filtros.
 no bgp ebgp-requires-policy
 no bgp default ipv4-unicast
 timers bgp 60 180
 ! eBGP com R2 (AS 65001) via to-r2
 neighbor 172.16.23.2 remote-as 65001
 neighbor 172.16.23.2 description eBGP-R2-AS65001
 ! iBGP com R4 (AS 65002) via to-r4
 neighbor 172.16.34.4 remote-as 65002
 neighbor 172.16.34.4 description iBGP-R4-AS65002
 !
 address-family ipv4 unicast
  ! anuncia a rede de acesso e o loopback deste roteador
  network 10.3.0.0/24
  network 10.255.0.3/32
  neighbor 172.16.23.2 activate
  neighbor 172.16.34.4 activate
  neighbor 172.16.34.4 next-hop-self
 exit-address-family
!
line vty
!
