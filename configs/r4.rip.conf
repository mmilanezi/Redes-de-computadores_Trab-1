! ===========================================================================
! R4 - protocolo ativo: RIP
! Sistema Autonomo: AS 65002
! Gerado por scripts/gerar_topologia.py  .
! ===========================================================================
frr version 8.4
frr defaults traditional
hostname r4
log stdout
no ipv6 forwarding
service integrated-vtysh-config
!
interface lo
 ip address 10.255.0.4/32
!
router rip
 version 2
 network 10.4.0.0/24
 network 172.16.34.0/29
 network 172.16.45.0/29
 network 10.255.0.4/32
 ! a LAN e o loopback nao possuem vizinhos RIP: nao ha por que
 ! inundar as redes de acesso com updates de roteamento.
 passive-interface lan
 passive-interface lo
 timers basic 30 180 120
!
line vty
!
