! ===========================================================================
! R1 - protocolo ativo: BGP
! Sistema Autonomo: AS 65001
! Gerado por scripts/gerar_topologia.py  .
! ===========================================================================
frr version 8.4
frr defaults traditional
hostname r1
log stdout
no ipv6 forwarding
service integrated-vtysh-config
!
interface lo
 ip address 10.255.0.1/32
!
router bgp 65001
 bgp router-id 10.255.0.1
 ! RFC 8212 exige politica explicita em sessoes eBGP; em laboratorio
 ! desativamos a exigencia para observar o protocolo sem filtros.
 no bgp ebgp-requires-policy
 no bgp default ipv4-unicast
 timers bgp 60 180
 ! iBGP com R2 (AS 65001) via to-r2
 neighbor 172.16.12.2 remote-as 65001
 neighbor 172.16.12.2 description iBGP-R2-AS65001
 ! eBGP com R5 (AS 65003) via to-r5
 neighbor 172.16.15.5 remote-as 65003
 neighbor 172.16.15.5 description eBGP-R5-AS65003
 !
 address-family ipv4 unicast
  ! anuncia a rede de acesso e o loopback deste roteador
  network 10.1.0.0/24
  network 10.255.0.1/32
  neighbor 172.16.12.2 activate
  neighbor 172.16.12.2 next-hop-self
  neighbor 172.16.15.5 activate
 exit-address-family
!
line vty
!
