! ===========================================================================
! R2 - protocolo ativo: BGP
! Sistema Autonomo: AS 65001
! Gerado por scripts/gerar_topologia.py  .
! ===========================================================================
frr version 8.4
frr defaults traditional
hostname r2
log stdout
no ipv6 forwarding
service integrated-vtysh-config
!
interface lo
 ip address 10.255.0.2/32
!
router bgp 65001
 bgp router-id 10.255.0.2
 ! RFC 8212 exige politica explicita em sessoes eBGP; em laboratorio
 ! desativamos a exigencia para observar o protocolo sem filtros.
 no bgp ebgp-requires-policy
 no bgp default ipv4-unicast
 timers bgp 60 180
 ! iBGP com R1 (AS 65001) via to-r1
 neighbor 172.16.12.1 remote-as 65001
 neighbor 172.16.12.1 description iBGP-R1-AS65001
 ! eBGP com R3 (AS 65002) via to-r3
 neighbor 172.16.23.3 remote-as 65002
 neighbor 172.16.23.3 description eBGP-R3-AS65002
 !
 address-family ipv4 unicast
  ! anuncia a rede de acesso e o loopback deste roteador
  network 10.2.0.0/24
  network 10.255.0.2/32
  neighbor 172.16.12.1 activate
  neighbor 172.16.12.1 next-hop-self
  neighbor 172.16.23.3 activate
 exit-address-family
!
line vty
!
