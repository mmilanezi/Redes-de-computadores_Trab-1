! ===========================================================================
! R5 - protocolo ativo: BGP
! Sistema Autonomo: AS 65003
! Gerado por scripts/gerar_topologia.py  .
! ===========================================================================
frr version 8.4
frr defaults traditional
hostname r5
log stdout
no ipv6 forwarding
service integrated-vtysh-config
!
interface lo
 ip address 10.255.0.5/32
!
router bgp 65003
 bgp router-id 10.255.0.5
 ! RFC 8212 exige politica explicita em sessoes eBGP; em laboratorio
 ! desativamos a exigencia para observar o protocolo sem filtros.
 no bgp ebgp-requires-policy
 no bgp default ipv4-unicast
 timers bgp 60 180
 ! eBGP com R1 (AS 65001) via to-r1
 neighbor 172.16.15.1 remote-as 65001
 neighbor 172.16.15.1 description eBGP-R1-AS65001
 ! eBGP com R4 (AS 65002) via to-r4
 neighbor 172.16.45.4 remote-as 65002
 neighbor 172.16.45.4 description eBGP-R4-AS65002
 !
 address-family ipv4 unicast
  ! anuncia a rede de acesso e o loopback deste roteador
  network 10.5.0.0/24
  network 10.255.0.5/32
  neighbor 172.16.15.1 activate
  neighbor 172.16.45.4 activate
 exit-address-family
!
line vty
!
