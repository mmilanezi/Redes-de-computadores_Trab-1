! ===========================================================================
! R3 - protocolo ativo: OSPF
! Sistema Autonomo: AS 65002
! Gerado por scripts/gerar_topologia.py  .
! ===========================================================================
frr version 8.4
frr defaults traditional
hostname r3
log stdout
no ipv6 forwarding
service integrated-vtysh-config
!
interface lo
 ip address 10.255.0.3/32
!
interface to-r2
 ip ospf cost 200
!
interface to-r4
 ip ospf cost 10
!
router ospf
 ospf router-id 10.255.0.3
 network 10.3.0.0/24 area 0
 network 172.16.23.0/29 area 0
 network 172.16.34.0/29 area 0
 network 10.255.0.3/32 area 0
 passive-interface lan
 passive-interface lo
!
line vty
!
